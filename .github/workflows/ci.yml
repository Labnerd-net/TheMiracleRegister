name: CI

# Check-only. Deploys are handled by the Cloudflare Workers Builds connector on push to main.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # worker-configuration.d.ts is gitignored; generate it for typechecking.
      - name: Generate Worker types
        run: npm run types

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test
        env:
          # Tests currently read the production Neon branch (backlog #22).
          # Not available to PRs from forks, so the test step fails for them.
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Build
        run: npm run build
